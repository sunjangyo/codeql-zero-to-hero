name: CodeQL Scan

on:
  push:
    branches:
      - query-cloud

  workflow_dispatch:

permissions:
  contents: read
  security-events: write # memberi izin untuk mengirim hasil sarif ke githubbb
  actions: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended #keamanan tambahan milik github

      # 3. Analyze source code
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
