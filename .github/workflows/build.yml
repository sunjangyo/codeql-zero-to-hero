name: Analyze Program container

on:
  push:
    branches: [jin-cli]
  pull_request:
    branches: [jin-cli]


permissions:
  contents: write   # wajib untuk membuat release

env:
  CODEQL_VERSION: codeql-bundle-v2.23.9

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache CodeQL
        id: cache-codeql
        uses: actions/cache@v4
        with:
          path: codeql
          key: codeql-${{ runner.os }}-${{ env.CODEQL_VERSION }}

      - name: Download codeql
        if: steps.cache-codeql.outputs.cache-hit != 'true'
        run: |
          echo "=================== new codeql =========================="
          wget -q https://github.com/github/codeql-action/releases/download/${{ env.CODEQL_VERSION }}/codeql-bundle-linux64.tar.gz
          tar xzf codeql-bundle-linux64.tar.gz
          rm codeql-bundle-linux64.tar.gz


      - name: Cache CodeQL database
        id: cache-codeql-db
        uses: actions/cache@v4
        with:
          path: example-codeql-db
          key: example-codeql-db

      - name: Create database
        if: steps.cache-codeql-db.outputs.cache-hit != 'true'
        run: |
          export PATH="`pwd`/codeql:$PATH"

          echo "=================== new create database =========================="
          codeql database create example-codeql-db --language=python


      - name: Analyze
        run: |
          export PATH="`pwd`/codeql:$PATH"
          mkdir -p out

          codeql database analyze \
              --format=csv \
              --output=out.csv \
              example-codeql-db \
              3/2/query.ql

          ls -l
          cp out.csv out

          # hasil ke out


      - name: Kompres
        run: |
          sudo chown -R $USER out
          tar czvf result.tar.gz \
            -C out .

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: myresult
          name: myresult
          files: |
            result.tar.gz



